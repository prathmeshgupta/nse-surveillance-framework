name: Daily/Weekly Surveillance Dataset Update

on:
  schedule:
    # Run at 15:30 UTC (21:00 IST) Monday to Friday, and Sunday at 02:00 UTC
    - cron: '30 15 * * 1-5'
    - cron: '0 2 * * 0'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  update-datasets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated dataset update
        run: python update.py

      - name: Commit and push changes if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --staged --quiet; then
            echo "No data changes detected."
          else
            git commit -m "chore(data): automated surveillance framework update [skip ci]"
            git push origin main
          fi
